name: Sync dataset from keepdwell.com

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download latest dataset from the site
        run: |
          curl -fsSL https://keepdwell.com/data/home-repair-costs.csv -o home-repair-costs.csv
          curl -fsSL https://keepdwell.com/data/home-repair-costs.json -o home-repair-costs.json
      - name: Commit if changed
        run: |
          git config user.name "keepdwell-dataset-sync"
          git config user.email "contact@keepdwell.com"
          if git diff --quiet; then
            echo "Already up to date."
          else
            git add home-repair-costs.csv home-repair-costs.json
            git commit -m "Dataset sync from keepdwell.com"
            git push
          fi
